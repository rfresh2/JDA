[versions]
fastutil = "8.5.19"
jackson = "3.2.2"

[libraries]
archunit = "com.tngtech.archunit:archunit:1.5.0"
assertj = "org.assertj:assertj-core:3.27.7"
commons-collections = "org.apache.commons:commons-collections4:4.6.0"
commons-lang3 = "org.apache.commons:commons-lang3:3.20.0"
eventbus = "com.github.rfresh2:SimpleEventBus:1.6"
fastutil-bom = { module = "com.github.rfresh2.fastutil:fastutil-bom", version.ref = "fastutil" }
fastutil-int-long-maps = { module = "com.github.rfresh2.fastutil.maps:int-long-maps"}
fastutil-int-object-maps = { module = "com.github.rfresh2.fastutil.maps:int-object-maps"}
fastutil-int-sets = { module = "com.github.rfresh2.fastutil.sets:int-sets"}
fastutil-long-int-maps = { module = "com.github.rfresh2.fastutil.maps:long-int-maps"}
fastutil-long-long-maps = { module = "com.github.rfresh2.fastutil.maps:long-long-maps"}
fastutil-long-object-maps = { module = "com.github.rfresh2.fastutil.maps:long-object-maps"}
fastutil-long-sets = { module = "com.github.rfresh2.fastutil.sets:long-sets"}
fastutil-object-int-maps = { module = "com.github.rfresh2.fastutil.maps:object-int-maps"}
errorprone-core = "com.google.errorprone:error_prone_core:2.50.0"
findbugs = "com.google.code.findbugs:jsr305:3.0.2"
jackson-bom = { module = "tools.jackson:jackson-bom", version.ref = "jackson" }
jackson-databind = { module = "tools.jackson.core:jackson-databind" }
jdave = "club.minnced:jdave-api:0.1.8"
jetbrains-annotations = "org.jetbrains:annotations:26.1.0"
jna = "net.java.dev.jna:jna:5.19.1"
junit = "org.junit.jupiter:junit-jupiter:6.1.0"
# @pin Newer versions require java 17 or higher
junit-java8 = "org.junit.jupiter:junit-jupiter:5.14.4"
junit-launcher = "org.junit.platform:junit-platform-launcher:6.1.0"
# @pin Newer versions require java 17 or higher
junit-launcher-java8 = "org.junit.platform:junit-platform-launcher:1.14.4"
logback-classic = "ch.qos.logback:logback-classic:1.6.3"
mockito = "org.mockito:mockito-core:5.23.0"
okhttp = "com.squareup.okhttp3:okhttp-jvm:5.5.0"
# @pin this is the last version available on maven central
openrewrite-bom = "org.openrewrite.recipe:rewrite-recipe-bom:3.37.0"
opus = "club.minnced:opus-java:1.1.1"
reflections = "org.reflections:reflections:0.10.2"
slf4j = "org.slf4j:slf4j-api:2.0.19"
# @pin Newer versions require java 11 or higher
tink = "com.google.crypto.tink:tink:1.18.0"
websocket-client = "com.neovisionaries:nv-websocket-client:2.14"

[bundles]
fastutil = [
    "fastutil-int-long-maps",
    "fastutil-int-object-maps",
    "fastutil-int-sets",
    "fastutil-long-int-maps",
    "fastutil-long-long-maps",
    "fastutil-long-object-maps",
    "fastutil-long-sets",
    "fastutil-object-int-maps",
]
jackson = [
    "jackson-databind",
]
junit = [
    "junit",
    "junit-launcher",
]
junit-java8 = [
    "junit-java8",
    "junit-launcher-java8",
]

[plugins]
errorprone = "net.ltgt.errorprone:5.1.1"
ideax = "org.jetbrains.gradle.plugin.idea-ext:1.4.1"
kotlin = "org.jetbrains.kotlin.jvm:2.4.10"
nmcp = "com.gradleup.nmcp:1.6.2"
nmcp-aggregation = "com.gradleup.nmcp.aggregation:1.6.2"
# @pin this is the last version available on maven central
openrewrite = "org.openrewrite.rewrite:7.39.0"
shadow = "com.gradleup.shadow:9.6.1"
spotless = "com.diffplug.spotless:8.10.2"
version-catalog-update = "nl.littlerobots.version-catalog-update:1.1.1"
